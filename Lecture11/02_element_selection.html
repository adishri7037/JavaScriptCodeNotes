<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Element Selection Demo</title>
  <style>
    .card { border: 1px solid #999; padding: 12px; margin: 8px 0; }
    .highlight { background: #fff3cd; }
  </style>
</head>
<body>
  <h1 id="mainHeading">Element Selection</h1>

  <section class="card profile-card">
    <h2 class="card-title">Profile</h2>
    <p class="info">Name: Ananya</p>
    <p class="info">Semester: 7</p>
  </section>

  <section class="card">
    <h2 class="card-title">Skills</h2>
    <ul id="skillsList">
      <li class="skill">HTML</li>
      <li class="skill">CSS</li>
      <li class="skill">JavaScript</li>
    </ul>
  </section>

  <script src="02_element_selection.js"></script>
</body>
</html>
