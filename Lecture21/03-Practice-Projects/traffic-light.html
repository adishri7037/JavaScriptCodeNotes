<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Traffic-Light Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e2e8f0;color:#0f172a;font-family:system-ui,sans-serif}
.card{width:min(92vw,420px);padding:2rem;border-radius:24px;background:white;box-shadow:0 15px 45px #0f172a20;text-align:center}
.signal{width:130px;padding:14px;margin:1rem auto;background:#111827;border-radius:28px;display:grid;gap:12px}
.lamp{width:92px;height:92px;margin:auto;border-radius:50%;background:#374151;opacity:.35;border:4px solid #020617}
.lamp.active{opacity:1;box-shadow:0 0 22px currentColor}
#red.active{background:#ef4444;color:#ef4444}#yellow.active{background:#facc15;color:#facc15}#green.active{background:#22c55e;color:#22c55e}
button{padding:.7rem 1rem;margin:.3rem;border:0;border-radius:10px;background:#0f172a;color:white;font-weight:700;cursor:pointer}
</style></head>
<body><main class="card"><h1>Traffic-Light Simulator</h1>
<div class="signal" role="img" aria-label="Traffic light">
<div id="red" class="lamp"></div><div id="yellow" class="lamp"></div><div id="green" class="lamp"></div>
</div><h2 id="phase">Stopped</h2><p id="remaining">Press Start to begin.</p>
<button id="start">Start</button><button id="stop">Stop</button><button id="next">Next phase</button>
<p><small>Red: 5s · Green: 5s · Yellow: 2s</small></p>
</main>
<script>
const phases = [
  {name:"Red", id:"red", duration:5},
  {name:"Green", id:"green", duration:5},
  {name:"Yellow", id:"yellow", duration:2}
];
let phaseIndex = 0;
let intervalId = null;
let phaseEndsAt = 0;
function render(secondsLeft) {
  document.querySelectorAll(".lamp").forEach(lamp => lamp.classList.remove("active"));
  const phase = phases[phaseIndex];
  document.getElementById(phase.id).classList.add("active");
  document.querySelector("#phase").textContent = `${phase.name} light`;
  document.querySelector("#remaining").textContent = `${Math.max(0, secondsLeft)} second(s) remaining`;
}
function startPhase() {
  phaseEndsAt = Date.now() + phases[phaseIndex].duration * 1000;
  render(phases[phaseIndex].duration);
}
function tick() {
  const left = Math.ceil((phaseEndsAt - Date.now()) / 1000);
  if (left <= 0) {
    phaseIndex = (phaseIndex + 1) % phases.length;
    startPhase();
  } else {
    render(left);
  }
}
function start() {
  if (intervalId !== null) return;
  startPhase();
  intervalId = setInterval(tick, 200);
}
function stop() {
  if (intervalId !== null) clearInterval(intervalId);
  intervalId = null;
  document.querySelector("#phase").textContent = "Stopped";
  document.querySelector("#remaining").textContent = "Press Start to resume the cycle.";
}
document.querySelector("#start").addEventListener("click", start);
document.querySelector("#stop").addEventListener("click", stop);
document.querySelector("#next").addEventListener("click", () => {
  phaseIndex = (phaseIndex + 1) % phases.length;
  startPhase();
  if (intervalId === null) {
    // Show selected phase without automatically starting a cycle.
    document.querySelector("#phase").textContent += " (preview)";
  }
});
</script></body></html>
