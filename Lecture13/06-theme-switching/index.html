<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Switching Architecture</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --surface: #f2f2f2;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .card { background: var(--surface); padding: 25px; border-radius: 12px; }
    body.dark {
      --bg: #111827;
      --text: #f9fafb;
      --surface: #1f2937;
    }
  </style>
</head>
<body>
  <button id="themeButton">Toggle theme</button>
  <main class="card">
    <h1>Theme Architecture</h1>
    <p>JavaScript changes one state class; CSS controls the visual design.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
