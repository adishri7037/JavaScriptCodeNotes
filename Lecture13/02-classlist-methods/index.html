<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>classList Methods</title>
  <style>
    .box { padding: 20px; border: 2px solid #333; }
    .active { outline: 4px solid #4caf50; }
    .large { font-size: 24px; }
  </style>
</head>
<body>
  <h1>classList Methods</h1>
  <button id="add">Add active</button>
  <button id="remove">Remove active</button>
  <button id="toggle">Toggle large</button>
  <button id="replace">Replace large with active</button>
  <div id="box" class="box">Interact with me.</div>
  <script src="script.js"></script>
</body>
</html>
