<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Product Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Product Store</h1>
      <p>Product cards rendered dynamically from a JavaScript array.</p>
      <button id="clearAll" type="button">Clear All Products</button>
    </header>

    <section id="productGrid" class="product-grid" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
