<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A vanilla JavaScript student management capstone demo.">
  <title>Student Management System</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <p class="eyebrow">VANILLA JAVASCRIPT CAPSTONE</p>
      <h1>Student Management System</h1>
      <p class="intro">Manage student records with a simple, responsive interface.</p>
    </div>
  </header>

  <main class="container layout">
    <section class="panel" aria-labelledby="form-heading">
      <h2 id="form-heading">Add a student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id">
        <div class="field">
          <label for="student-name">Full name</label>
          <input id="student-name" name="name" autocomplete="name" minlength="2" maxlength="80" required>
          <small id="name-error" class="field-error"></small>
        </div>
        <div class="field">
          <label for="student-email">Email address</label>
          <input id="student-email" name="email" type="email" autocomplete="email" maxlength="120" required>
          <small id="email-error" class="field-error"></small>
        </div>
        <div class="field">
          <label for="student-course">Course</label>
          <select id="student-course" name="course" required>
            <option value="">Choose a course</option>
            <option>JavaScript</option>
            <option>React</option>
            <option>Node.js</option>
            <option>Python</option>
            <option>Data Structures</option>
          </select>
          <small id="course-error" class="field-error"></small>
        </div>
        <div class="button-row">
          <button id="submit-button" type="submit">Add student</button>
          <button id="cancel-edit" class="secondary" type="button" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="panel records" aria-labelledby="records-heading">
      <div class="records-heading">
        <div>
          <h2 id="records-heading">Student records</h2>
          <p id="student-count" class="muted">0 students</p>
        </div>
        <label class="search-label" for="student-search">Search records
          <input id="student-search" type="search" placeholder="Name, email, or course">
        </label>
      </div>
      <p id="status-message" class="status" role="status" aria-live="polite"></p>
      <div id="student-list" class="student-list"></div>
    </section>
  </main>

  <footer class="container footer">
    <p>Learning demo only. Use fictional data; localStorage is not a production student database.</p>
  </footer>
</body>
</html>
